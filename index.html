<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gudrā klase</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
    header { background: #2563eb; color: #fff; padding: 2rem 1rem; text-align: center; }
    main { max-width: 800px; margin: 0 auto; padding: 1rem; }
    .cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card { background: #fff; border-radius: 12px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    footer { text-align: center; padding: 1rem; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>Gudrā klase</h1>
    <p>Mācāmies kopā — gudri un ar prieku!</p>
  </header>
  <main>
    <div class="cards">
      <section class="card"><h2>Uzdevumi</h2><p>Šeit drīz būs mājasdarbi un uzdevumi.</p></section>
      <section class="card"><h2>Materiāli</h2><p>Mācību materiāli pa priekšmetiem.</p></section>
      <section class="card"><h2>Paziņojumi</h2><p>Svarīgākā informācija klasei.</p></section>
    </div>
  </main>
  <footer>© Gudrā klase</footer>
</body>
</html>
